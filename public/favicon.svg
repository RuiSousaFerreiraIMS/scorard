    <!-- espada dourada -->
    <path fill="url(#gold)" d="M256 168
      c 34 44 78 66 78 108
      c 0 28 -22 46 -46 46
      c -12 0 -22 -4 -30 -12
      c 4 22 10 34 22 44
      l -48 0
      c 12 -10 18 -22 22 -44
      c -8 8 -18 12 -30 12
